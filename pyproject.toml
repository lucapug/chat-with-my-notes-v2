[project]
name = "chat-with-my-notes-v2"
version = "0.2.0"
description = "RAG over personal knowledge base — Phase 3 (pydantic-ai + FastAPI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Agent framework — Ollama via OpenAI-compat base_url
    "pydantic-ai[openai]>=0.0.14",

    # HTTP entrypoint
    "fastapi>=0.116.1",
    "uvicorn[standard]>=0.35.0",

    # Config
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.1.1",

    # Search index (BRF — migrated from sprint1)
    "minsearch>=0.0.11",

    # Frontmatter parsing (notion adapter)
    "pyyaml>=6.0.3",

    # HTTP client (replaces urllib.request in brf.py and evaluation/)
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
